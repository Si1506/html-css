<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        table {
            width: 500px;
            border-collapse: collapse; 
        }
        thead {
            background-color: darkgrey;
            color: white;
            text-align: center;
        }        
        th.media, td.media {
            background-color: darkgrey;
            color: white;
            text-align: left;
        } 
        th, td {
            border: 4px solid black;
            padding: 20px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th> 
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th> 
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>5.0</td>
                <td>1.8</td>
                <td>1.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>7.2</td>
                <td>8.4</td>
                <td>9.7</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>5.8</td>
                <td>6.0</td>
                <td>6.8</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>8.3</td>
                <td>7.9</td>
                <td>8.6</td>
            </tr>
            <tr>
                <th colspan="4" scope="col" class="media">Média de Exatas</th>
                <td class="media">9.8</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>8.4</td>
                <td>4.9</td>
                <td>9.2</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>7.1</td>
                <td>6.8</td>
                <td>7.9</td>
            </tr>
            <tr>
                <th colspan="4" scope="col" class="media">Média de Humanas</th>
                <td class="media">8.8</td>
            </tr>
        </tbody>
    </table>    
</body>
</html>
