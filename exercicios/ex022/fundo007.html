<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>

        /*Exercício incompleto pois algumas imagens importantes não baixaram (target001.png) */

        #container {
            position: relative;
            height: 96vh;
            padding: 10px;
            background-color: purple;
        }      

        #conteudo {
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: yellow;
            margin: auto;

            left: 50px;
            top: 50px;

            transform: translate(480px, 170px);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
    
</body>
</html>
