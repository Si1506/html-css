<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;       
    }

    h1 {
        color:blue;
        text-align: left;
    }

    table {
        width: 600px;
        height: 600px;
        border-collapse: collapse;
        border: 5px solid blueviolet;     
    }

    td {
        border: 1px solid black;
        padding: 8px; 
        text-align: center; /* Alinhamento horizontal*/     
        vertical-align: top;  /* Alinhamento vertical*/
    }

    td.numero {
        text-align: right;
    }

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
    HIERARQUIA DE TABELAS (simples)
    TABLE = tabela
        TABLE ROW = linha de tabela - tag (tr)
            TABLE HEADER = cabeçalho da tabela
                TABLE DATA = dado de tabela - tag (td)
    -->
    <table>
        <tr> <!-- Primeira Linha --> 
            <td>AMOR</td>
            <td>PAIXÃO</td>
            <td>CARINHO</td>
        </tr>
        <tr> <!-- Segunda Linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!-- Terceira Linha -->
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr> <!-- Quarta Linha -->
            <td>A4</td>
            <td>B4</td>
            <td class="numero">C4</td>
        </tr>
    </table>    
</body>
</html>
