<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        caption {
            font-size: 1em;
            padding: 10px;
            font-weight: bold;
            background-color: rgba(96, 151, 151, 0.473);            
        }
        table {
            width: 400px;
            border-collapse: collapse;  
            padding: 6px;    
            text-align: center;      
        }
        td {
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
<h1>Mesclagem de Células</h1>

<table>
    <caption>Aprendendo a mesclagem de células.</caption>
    <tr>
        <td>A</td>
        <td colspan="2">B</td>
        
    </tr>
    <tr>
        <td rowspan="3">D</td>
        <td>E</td>
        <td>F</td>
    </tr>
    <tr>
        
        <td>H</td>
        <td rowspan="2">I</td>
    </tr>
    <tr>
        
        
        <td>L</td>
    </tr>
</table>
    
</body>
</html>
